[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

# No second HTTP client: the server's egress policy is only as strong as the one
# client that enforces it (ADR 0014 §7, case U30c). It is not part of the
# per-increment gate, but an added dependency fails a release check.
[[bans.deny]]
name = "reqwest"

[[bans.deny]]
name = "ureq"

[[bans.deny]]
name = "isahc"

[[bans.deny]]
name = "curl"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
