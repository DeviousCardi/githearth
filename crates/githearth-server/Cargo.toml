[package]
name = "githearth-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
async-compression = { version = "0.4", features = ["gzip", "tokio"] }
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false }
githearth-authz = { path = "../githearth-authz" }
githearth-core = { path = "../githearth-core" }
githearth-git = { path = "../githearth-git" }
base64 = "0.22"
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "signal", "time", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["limit", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
flate2 = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
