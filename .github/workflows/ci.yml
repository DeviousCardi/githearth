name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: githearth
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: githearth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U githearth -d githearth_test"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      GITHEARTH_TEST_DATABASE_URL: postgres://githearth:ci-only@127.0.0.1:5432/githearth_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Tests with coverage, including PostgreSQL contract tests
        run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info -- --include-ignored
      - name: Coverage gate
        run: cargo llvm-cov report --summary-only --fail-under-lines 85
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: lcov.info

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build --pull -t githearth-server:ci .
