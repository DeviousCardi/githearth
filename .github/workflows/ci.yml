name: CI

# Manual only, to avoid spending Actions minutes. scripts/ci.sh runs the same
# gates locally and is required before merging.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Third-party notices are up to date
        run: python3 scripts/generate-third-party-notices.py --check

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: githearth
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: githearth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U githearth -d githearth_test"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      GITHEARTH_TEST_DATABASE_URL: postgres://githearth:ci-only@127.0.0.1:5432/githearth_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Tests with coverage, including PostgreSQL contract tests
        run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info -- --include-ignored
      - name: Coverage gate
        run: cargo llvm-cov report --summary-only --fail-under-lines 95
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: lcov.info

  online-backup-btrfs:
    # The copy-on-write snapshot path skips on the ext4 runner above, so the
    # clone is otherwise evidenced only on APFS. A btrfs loopback gives the
    # online cases a real reflink filesystem on Linux.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: githearth
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: githearth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U githearth -d githearth_test"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      GITHEARTH_TEST_DATABASE_URL: postgres://githearth:ci-only@127.0.0.1:5432/githearth_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - name: A btrfs loopback for the storage snapshot
        run: |
          sudo apt-get update
          sudo apt-get install -y btrfs-progs
          sudo truncate -s 6G /btrfs.img
          sudo mkfs.btrfs -q /btrfs.img
          sudo mkdir -p /mnt/btrfs
          sudo mount -o loop /btrfs.img /mnt/btrfs
          sudo chown "$(id -u):$(id -g)" /mnt/btrfs
      - name: Online backup suite with a real clone
        env:
          TMPDIR: /mnt/btrfs
        run: cargo test -p githearth-server --test online_backup --locked -- --include-ignored

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build --pull -t githearth-server:ci .
