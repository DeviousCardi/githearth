# Local development only. Generate .env using the runbook; never reuse these credentials.
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: githearth
      POSTGRES_USER: githearth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?generate .env as described in docs/foundation.md}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U githearth -d githearth"]
      interval: 2s
      timeout: 2s
      retries: 30
  migrate:
    build: .
    command: ["migrate"]
    environment: &app-environment
      GITHEARTH_DATABASE_URL: postgres://githearth:${POSTGRES_PASSWORD}@postgres:5432/githearth
      GITHEARTH_BIND: 0.0.0.0:8080
      GITHEARTH_SECURE_COOKIES: 'false'
      GITHEARTH_SSH_ENABLED: 'true'
    volumes:
      - repositories:/var/lib/githearth
    depends_on:
      postgres:
        condition: service_healthy
  ssh-keygen:
    build: .
    command: ["ssh-keygen"]
    # Config validation needs the database URL; ssh-keygen itself never connects.
    environment: *app-environment
    volumes:
      - repositories:/var/lib/githearth
    depends_on:
      migrate:
        condition: service_completed_successfully
  app:
    build: .
    environment: *app-environment
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:2222:2222"
    volumes:
      - repositories:/var/lib/githearth
    depends_on:
      ssh-keygen:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
  repositories:
