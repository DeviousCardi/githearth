# WARNING: listing an untrusted address here lets clients spoof their IP.
# trusted_proxies = ["127.0.0.1", "10.0.0.0/8"]
# Failed sign-ins allowed per username and per client address inside the window.
# See docs/operations/accounts.md; no account is ever locked permanently.
# After the fifth recorded failure every password attempt also waits
# base*2^(failures-5) ms, capped at the delay maximum (both are adjustable).
# login_throttle_max_per_username = 5
# login_throttle_max_per_client = 20
# login_throttle_window_seconds = 900
# login_throttle_delay_base_ms = 200
# login_throttle_delay_max_ms = 2000
# Metrics endpoint (docs/operations/metrics.md). Off by default; when on it
# answers only a loopback client and publishes the documented metric and label
# list, which carries no organization, repository or account identifier.
# metrics_enabled = true
# Answers a non-loopback client too. Only for a deliberate decision: the
# listener must be on a private interface nothing else can reach, and the line
# is accepted only together with `metrics_enabled = true` above (on its own it
# is refused at load, because it would do nothing).
# metrics_allow_non_loopback = true
# Outbound request client (ADR 0014 section 7, case U30c). Every HTTP request
# the server itself makes -- OIDC discovery, external action sources, webhooks,
# mirrors, importers -- goes through this one client. The allowlist is empty by
# default, so nothing is callable until an operator names the destination; an
# unlisted host is refused. Loopback, link-local, private-range and
# cloud-metadata answers are refused too. `outbound_allow_private` opens the
# private ranges for internal services; metadata endpoints need their own
# `outbound_allow_metadata`, so opening an internal network never exposes cloud
# credentials. A redirect to a different host is always refused; a same-host
# redirect is followed up to the limit and may not change the scheme. The DNS
# answer is checked and then pinned for the connection, so a changed answer
# cannot redirect it. Every allow and refusal is recorded with its reason.
# Entries are `host`, `host:port` or `*.domain` (subdomains only, not the apex).
# A host without a port covers only the standard ports 80 and 443; name another
# port explicitly. An IP literal is refused: every destination is a DNS name.
# A loopback SMTP relay also needs `outbound_allow_private = true` below.
# outbound_allowlist = ["api.example.com", "*.hooks.example.com"]
# outbound_allow_private = false
# outbound_allow_metadata = false
# outbound_timeout_seconds = 30          # whole request, DNS, redirects and body
# outbound_max_response_bytes = 5242880  # 5 MiB
# outbound_max_request_bytes = 1048576   # 1 MiB
# outbound_max_redirects = 5             # same-host hops; 0 refuses all redirects
# Outbound email (docs/operations/email.md). Disabled while smtp_host is empty.
# The verification link and notification mail are queued durably; when SMTP is
# configured they are delivered from the outbox consumer, never from a request.
# smtp_host = "smtp.example.com"
# smtp_port = 587
# smtp_tls = "starttls"            # starttls | implicit | none (none is refused with smtp_username)
# smtp_from = "githearth@example.com"
# smtp_bounce_address = "bounces@example.com"  # MAIL FROM; falls back to smtp_from
# smtp_dkim_selector = "default"                # doctor checks <selector>._domainkey.<domain>
# abuse_contact = "abuse@example.com"           # published before sign-up
# email_dns_check_enabled = true                # SPF/DKIM/DMARC lookup in `doctor`
# smtp_username = "githearth"
# smtp_password_file = "/etc/githearth/smtp-password"  # read once at start-up;
#                                                     # never a TOML value, never logged.
#                                                     # "-" reads one line from stdin.
# public_url = "https://githearth.example"  # base of links in mail; no trailing slash needed
# Backup and restore (docs/operations/backup-restore.md). `backup` refuses
# unless the server is stopped (its listeners refuse connections) or this
# process is in maintenance mode and has drained. The archive is encrypted;
# the key is read from a file or stdin, never from an argument or this file.
# backup_directory = "backups"          # --output overrides the file name
# backup_key_file = "/etc/githearth/backup.key"  # mode 0600; --key-file overrides
# maintenance_drain_timeout_seconds = 300  # how long `maintenance start` waits
# Secrets at rest (ADR 0014 §3, docs/operations/secrets-at-rest.md). Every
# stored secret is wrapped by this operator key. Mode 0600, outside
# storage_root and outside every backup; losing it loses the secrets.
# installation_key_file = "/etc/githearth/installation.key"
# installation_key_previous_file = "/etc/githearth/installation.previous.key"
# installation_key_method = "file"       # file | kms (no built-in KMS adapter)
# installation_key_passphrase_file = "/etc/githearth/installation.passphrase"
