# Copy to a private location; prefer GITHEARTH_DATABASE_URL for the secret URL.
# database_url = "postgres://githearth:GENERATED_LOCAL_PASSWORD@127.0.0.1:54329/githearth"
bind = "127.0.0.1:8080"
database_max_connections = 10
database_timeout_seconds = 3
request_timeout_seconds = 15
token_ttl_seconds = 3600
# Last day a legacy repo:read/repo:write token is accepted; it is refused from
# the following midnight UTC. It must be in 2026-11-16..=2027-06-30, so it can
# shorten the window but never extend it. `doctor` reports the enforced cutoff
# and the remaining count.
# See docs/operations/tokens.md and ADR 0014 section 2a.
# legacy_token_deprecation_date = "2027-06-30"
body_limit_bytes = 524288
# secure_cookies = true  # set false only for local HTTP development
auth_concurrency = 2
