# job_timeout_seconds = 60
# job_poll_interval_ms = 500
# job_retention_days = 7
# housekeeping_enabled = true            # scheduled repack + prune (ADR 0013)
# housekeeping_interval_seconds = 86400  # how often each repository is due
# housekeeping_grace_seconds = 691200    # 8 days: keep unreachable objects this long
# housekeeping_concurrency = 2           # runs in flight at once
# housekeeping_timeout_seconds = 600     # bound on each of the run's seven phases
#                                        # (pins, both live-set walks, the size
#                                        # walk, repack, scan+delete, verification);
#                                        # the job kind's budget is 7x+60s. The
#                                        # journal replay before them is bounded by
#                                        # git_timeout_seconds, not by this sum
# housekeeping_max_live_set_bytes = 67108864  # refuse to prune if rev-list output is larger
# housekeeping_pin_retention_days = 90   # keep a closed pull request's head and base,
