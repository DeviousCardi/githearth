# Copy to a private location; prefer GITHEARTH_DATABASE_URL for the secret URL.
# database_url = "postgres://githearth:GENERATED_LOCAL_PASSWORD@127.0.0.1:54329/githearth"
bind = "127.0.0.1:8080"
database_max_connections = 10
database_timeout_seconds = 3
request_timeout_seconds = 15
token_ttl_seconds = 3600
body_limit_bytes = 524288
# secure_cookies = true  # set false only for local HTTP development
auth_concurrency = 2
# storage_root = "data/repositories"
# reconcile_interval_seconds = 60
# reconcile_grace_seconds = 300
# merge_worker_interval_seconds = 2
# trash_retention_seconds = 604800
# git_concurrency = 8
# git_timeout_seconds = 600
# git_request_limit_bytes = 10485760
# git_push_limit_bytes = 1073741824  # upload size and receive.maxInputSize
# repository_quota_bytes = 1073741824  # total on-disk objects; 0 = unlimited
# hook_program = "/path/to/githearth-server"  # default: the running executable
# ssh_enabled = false
# ssh_bind = "127.0.0.1:2222"
# ssh_host_key_path = "/etc/githearth/ssh_host_key"  # required when ssh_enabled; generate with `githearth-server ssh-keygen`
# job_concurrency = 4
# job_timeout_seconds = 60
# job_poll_interval_ms = 500
# job_retention_days = 7
# housekeeping_enabled = true            # scheduled repack + prune (ADR 0013)
# housekeeping_interval_seconds = 86400  # how often each repository is due
# housekeeping_grace_seconds = 691200    # 8 days: keep unreachable objects this long
# housekeeping_concurrency = 2           # runs in flight at once
# housekeeping_timeout_seconds = 600     # bound on each of the run's seven phases
#                                        # (pins, both live-set walks, the size
#                                        # walk, repack, scan+delete, verification);
#                                        # the job kind's budget is 7x+60s. The
#                                        # journal replay before them is bounded by
#                                        # git_timeout_seconds, not by this sum
# housekeeping_max_live_set_bytes = 67108864  # refuse to prune if rev-list output is larger
# housekeeping_pin_retention_days = 90   # keep a closed pull request's head and base,
#                                        # and a superseded status's commit, this long
# housekeeping_fork_fetch_limit_bytes = 67108864  # most bytes one fork pull request's
#                                        # head may copy into its target (refused above)
# WARNING: listing an untrusted address here lets clients spoof their IP.
# trusted_proxies = ["127.0.0.1", "10.0.0.0/8"]
# Failed sign-ins allowed per username and per client address inside the window.
# See docs/operations/accounts.md; no account is ever locked permanently.
# login_throttle_max_per_username = 10
# login_throttle_max_per_client = 50
# login_throttle_window_seconds = 900
# Metrics endpoint (docs/operations/metrics.md). Off by default; when on it
# answers only a loopback client and publishes the documented metric and label
# list, which carries no organization, repository or account identifier.
# metrics_enabled = true
# Answers a non-loopback client too. Only for a deliberate decision: the
# listener must be on a private interface nothing else can reach, and the line
# is accepted only together with `metrics_enabled = true` above (on its own it
# is refused at load, because it would do nothing).
# metrics_allow_non_loopback = true
